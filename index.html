<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ओवी आधार प्रिंट सर्विस</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center justify-center py-10 px-4 sm:px-6 lg:px-8">

    <!-- मेन कंटेनर -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 md:p-10 border-t-4 border-blue-600">
        
        <!-- हेडर सेक्शन -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-blue-800 mb-3">ओवी आधार प्रिंट सर्विस</h1>
            <p class="text-gray-600 text-sm md:text-base">कृपया नीचे दिए गए मेनू से अपना फॉर्म चुनें।</p>
        </div>

        <!-- ड्रॉपडाउन सेक्शन -->
        <div class="mb-8">
            <label for="formDropdown" class="block text-sm font-semibold text-gray-700 mb-2">दस्तावेज़ चुनें:</label>
            <select id="formDropdown" onchange="showButton()" class="block w-full bg-gray-50 border border-blue-300 text-gray-900 text-lg rounded-lg focus:ring-blue-600 focus:border-blue-600 p-4 shadow-sm cursor-pointer transition duration-200 ease-in-out hover:border-blue-500 outline-none">
                <option value="">-- कृपया यहाँ क्लिक करके दस्तावेज़ चुनें --</option>
                
                <!-- आपके फॉर्म्स के असली नाम -->
                <option value="https://docs.google.com/forms/d/e/1FAIpQLSdpdepmkjHhEFdRh8dPWoKDbOx19byFGJhRacJ_fRExsGKMeQ/viewform">जाति प्रमाण पत्र </option>
                <option value="https://docs.google.com/forms/d/1lkJFrM4LglIZYyir9Qh1ygu_JHT1XB99WYBEKmLx-gw/viewform">बागपत मूल निवास</option>
                <option value="https://docs.google.com/forms/d/1wPfH86NWL3haRHe3Z0dj69FzhTZCUMZQvmdMUANmoIA/viewform">Date of Birth Certificate Meerut</option>
                <option value="https://docs.google.com/forms/d/1I_X_PBGZqJgpc3dUebfhwPSYZger-e-3pt8SqDSERII/viewform">शामली मूल निवास</option>
                <option value="https://docs.google.com/forms/d/1qYp-oP9MpuQ4tBxoa6NJ8aAEiEw_yIpEcomasa7cXQc/viewform">मुज़फ्फरनगर मूल निवास</option>
                <option value="https://docs.google.com/forms/d/1tBAoyEVGeUzWhX6WIHzm9skbka_fjp3qw9odIIP0A90/viewform">Annexure 1 for Adult</option>
                <option value="https://docs.google.com/forms/d/e/1FAIpQLSd81qZQ7eCtB3Kh90f45GPInQf420YHnXMgwmE_kI8TymI2IA/viewform">Annexure 1A for Children</option>
               
            </select>
        </div>

        <!-- फॉर्म खोलने का बटन (सर्विस चुनने के बाद ही दिखेगा) -->
        <div id="actionContainer" class="hidden flex flex-col items-center">
            <p class="text-green-600 text-sm font-medium mb-4">दस्तावेज़ सफलतापूर्वक चुन लिया गया है!</p>
            <button onclick="openForm()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform transition hover:scale-105 flex items-center justify-center text-lg">
                <span>फॉर्म खोलें और भरें</span>
                <!-- एरो (Arrow) आइकॉन -->
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </button>
            <p class="text-gray-400 text-xs mt-3 text-center">फोटो अपलोड और सुरक्षा कारणों से यह फॉर्म एक नए सुरक्षित टैब में खुलेगा।</p>
        </div>
        
    </div>

    <!-- जावास्क्रिप्ट (बटन दिखाने और नए टैब में खोलने के लिए) -->
    <script>
        function showButton() {
            const dropdown = document.getElementById("formDropdown");
            const actionContainer = document.getElementById("actionContainer");
            
            if (dropdown.value) {
                // फॉर्म चुनने पर बटन दिखाएं
                actionContainer.classList.remove("hidden");
            } else {
                // कुछ न चुनने पर बटन छिपा लें
                actionContainer.classList.add("hidden");
            }
        }

        function openForm() {
            const dropdown = document.getElementById("formDropdown");
            if (dropdown.value) {
                // फॉर्म को नए टैब में खोलें
                window.open(dropdown.value, '_blank');
            }
        }
    </script>
</body>
</html>
